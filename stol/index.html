  --scarlet: #ef493e;
  --pink: #ff9fce;
  --yellow: #f7cf4a;
  --cover: #25475c;

  --f-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-hand: "Shantell Sans", "Comic Sans MS", "Segoe Print", cursive;
  --r-card: 14px 18px 12px 16px / 16px 12px 18px 14px;

}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; color: var(--ink); font: 400 16.5px/1.5 var(--f-body); background: var(--desk); }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: var(--grain); opacity: .12; mix-blend-mode: multiply; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px dashed var(--scarlet); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.top img { height: 30px; width: auto; display: block; transform: rotate(-3deg); filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff); }

.nb {
  position: relative; display: block; width: 100%; text-align: left;

  background: var(--cover); color: var(--cream); cursor: pointer;
  transition: transform .15s;
}
.nb::after { content: ""; position: absolute; top: -3px; bottom: -3px; right: 22px; width: 12px; background: var(--scarlet); border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); }
.nb:hover { transform: translateX(4px) rotate(-.6deg); }

.nb__new { position: absolute; top: -12px; left: 12px; padding: 3px 8px; border: 2px solid var(--ink); border-radius: 999px; background: var(--yellow); color: var(--ink); font: 700 11px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; transform: rotate(-4deg); }

.drop b { display: block; font: 400 21px/1.1 var(--f-hand); color: var(--ink); margin-bottom: 4px; }

.sheet {

window.COURSE = {"id": "vsmysle-pilot", "version": "прототип 0.4 · пилот", "title": "В смысле сложно?", "subtitle": "Как сделать ИИ своим личным помощником, даже если ты в нём ничего не понимаешь", "routeTitle": "Четыре недели, девять стоянок", "author": {"name": "Ваня Григоренко", "short": "Ваня", "dative": "Ване", "telegram": "cinemavanya"}, "base": {"url": "https://cinemavanya.github.io/vsmysle-base/base.json", "link": "https://cinemavanya.github.io/vsmysle-base/"}, "chapters": [{"n": 0, "kind": "meet", "week": 1, "title": "Знакомство", "short": "Как устроены четыре недели", "meeting": {"when": "Понедельник, 19:00 · Телемост, ссылка в чате группы", "length": "30 минут", "bring": "Компьютер с интернетом. Камера — по желанию."}, "body": [{"t": "h", "text": "Зачем мы здесь"}, {"t": "p", "text": "За месяц ИИ станет твоим **личным помощником** в повседневных делах: будет разбирать документы и файлы, превращать поток мыслей в план, помнить твои проекты и по утрам сам присылать, что сегодня важно."}, {"t": "p", "text": "Разбираться в технологиях для этого не нужно. Работать с ИИ — как с толковым помощником: **поставить задачу, дать контекст, проверить результат**. Этому и учимся."}, {"t": "aside", "text": "Сайт и своё приложение тоже будут. Не потому, что ты станешь программистом, — а чтобы убедиться: это не так страшно, как звучит."}, {"t": "h", "text": "Как устроен курс"}, {"t": "list", "items": ["Четыре недели, восемь живых встреч в Телемосте.", "**Вторник, 19:00–20:30** — урок: основа и первый шаг вместе.", "**Суббота, 14:00–17:00** — практика: разбираем сделанное за неделю и делаем новое.", "Каждая глава открывается словом — его называют в конце предыдущей встречи. Пропустил встречу — слово лежит в «Объявлениях».", "Встречи записываются, запись появляется в главе. Там же — «Свежее со встречи»: что поменялось и что попробовали вживую."]}, {"t": "p", "text": "**Оценок нет.** Задачи — чтобы попробовать руками. Ваня смотрит домашку и оставляет пометки на полях. Главная задача в каждой главе отмечена звездой — начни с неё."}, {"t": "p", "text": "Блокнот остаётся у тебя и после курса: в каждой главе тезисы, заготовки и ссылки на программы — чтобы было к чему вернуться."}, {"t": "h", "text": "Как устроен наш чат"}, {"t": "list", "items": ["**Объявления** — пишет только Ваня: ссылки на встречи, слова к главам, напоминания.", "**Помогите** — застрял? Пиши по форме: скриншот + что делал + что ожидал.", "**Галерея** — обложки, сайты, приложения, удачные ответы. Хвастаться можно и нужно.", "**Болталка** — всё остальное: находки, вопросы не по заданию, мемы."]}, {"t": "aside", "text": "Форма «скриншот + что делал + что ожидал» — тот же бриф, которому научимся во вторник. Только для людей."}, {"t": "list", "items": ["Прежде чем писать в «Помогите», покажи тот же скриншот ChatGPT — часто он справляется сам.", "Решилось — напиши, что помогло: следующему пригодится.", "Никаких паролей, ключей, номеров карт и чужих данных — даже на скриншотах. Замазывай.", "Не получается больше 15 минут — не мучайся, пиши."]}], "links": [{"t": "ChatGPT для компьютера", "u": "https://chatgpt.com/download"}, {"t": "Яндекс Телемост", "u": "https://telemost.yandex.ru/"}], "tasks": [{"id": "0.1", "main": true, "quote": "Хочу, чтобы было моё", "title": "Оформи обложку блокнота и покажи её в галерее", "steps": ["Закрой блокнот — стрелкой ← с маршрута или ссылкой «Закрыть блокнот».", "Нажми «Кастомизировать» справа внизу.", "Выбери цвет, узор и резинку, впиши имя, наклей наклейки.", "Сделай скриншот обложки и выложи его в «Галерею»."], "hint": "Наклейки можно тащить, крутить и увеличивать. Стрелки на клавиатуре двигают выбранную, Delete — отклеивает.", "result": {"link": false, "placeholder": "Что получилось на обложке"}}]}, {"n": 1, "kind": "lesson", "week": 1, "title": "Как с ней разговаривать", "short": "Бриф вместо промпта", "tasks": [{"id": "1.1", "main": true}, {"id": "1.2"}, {"id": "1.3"}], "lock": {"v": 1, "iv": "pjiy+yq50TAMxxdA", "data": "rUQZZU9IWEzpN+4vuvN <script>
(() => {
  "use strict";
  /* Стол на сайте. Ваня входит на той же странице, что ученики, — флаг admin на аккаунте отправляет его сюда.
     Блокноты учеников (notebooks/*) приходят сами и обновляются на глазах; пометки (marks/{uid}) сохраняются
     сами, и ученик видит их сразу. Курс здесь, как и в Блокноте, лежит под словами: слова Стол берёт
     из private/words, а этот документ по правилам читает только админ. */
  const C = window.COURSE, CLOUD = window.CLOUD, FB = window.FB;
  const VIEW_KEY = `vsmysle-desk:${C.id}:site`;
  const $ = (s, r = document) => r.querySelector(s);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid);
    return el;
  }
  const fmt = iso => iso ? new Date(iso).toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) : "—";
  const fmtT = iso => iso ? new Date(iso).toLocaleString("ru-RU", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) : "—";
  const autosize = el => { el.style.height = "auto"; el.style.height = el.scrollHeight + 2 + "px"; };
  let ALL = [], byId = {};
  const index = () => { ALL = C.chapters.flatMap(ch => (ch.tasks || []).map(t => ({ ...t, ch: ch.n }))); byId = Object.fromEntries(ALL.map(t => [t.id, t])); };
  index();

  let toastT;
  function toast(msg, bad) {
    const el = $("#toast"); el.textContent = msg; el.classList.toggle("toast--bad", !!bad); el.classList.add("is-on");
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("is-on"), bad ? 6000 : 3500);
  }

  /* ---------- главы под словами: те же параметры, что в Блокноте и build.py ---------- */
  const enc = new TextEncoder(), dec = new TextDecoder();
  const normWord = w => String(w || "").trim().toLowerCase().replace(/ё/g, "е");
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function unlock(ch, word) {
    const base = await crypto.subtle.importKey("raw", enc.encode(normWord(word)), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: enc.encode(`vsmysle:${C.id}:${ch.n}`), iterations: 150000, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const hidden = JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(ch.lock.iv) }, key, unb64(ch.lock.data))));
    for (const k of ["body", "meeting", "video", "links"]) if (hidden[k]) ch[k] = hidden[k];
    for (const t of ch.tasks || []) if (hidden.tasks?.[t.id]) Object.assign(t, hidden.tasks[t.id]);
    delete ch.lock;
  }

  /* ---------- данные ---------- */
  let view;
  try { view = JSON.parse(localStorage.getItem(VIEW_KEY)) || null; } catch (e) { view = null; }
  if (!view) view = { selected: null, onlyAnswered: true };
  const saveView = () => { try { localStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch (e) {} };
  const NB = {}, MK = {};            // uid → блокнот ученика, uid → мои пометки ему
  const pending = {};                // uid → { items: Set, general } — поменял, но ещё не отправил
  let db = null, auth = null, ready = false;

  const list = () => Object.keys(NB).map(uid => ({ uid, nb: NB[uid], mk: mk(uid) }))
    .sort((a, b) => nameOf(a).localeCompare(nameOf(b), "ru"));
  const mk = uid => (MK[uid] ||= { general: "", items: {} });
  const nameOf = st => st.nb.student?.name || st.nb.login || "без имени";
  const doneN = st => ALL.filter(t => st.nb.tasks?.[t.id]?.done).length;
  const hasNew = st => !!st.nb.updatedAt && (!st.mk.lookAt || st.nb.updatedAt > st.mk.lookAt);
  const metaOf = st => st.nb.updatedAt ? `вычеркнуто ${doneN(st)} из ${ALL.length} · ${fmtT(st.nb.updatedAt)}` : "блокнот ещё не открывали";

  const SYNC = { ok: "сохранено", saving: "сохраняю…", error: "не сохраняется — проверь интернет", offline: "нет связи" };
  function setSync(s) { const el = $("#sync"); el.hidden = false; el.dataset.s = s; el.lastElementChild.textContent = SYNC[s]; }

  /* ---------- пометки сохраняются сами ---------- */
  const timers = {};
  function touch(uid, id) {           // id задачи или null — общая записка
    const p = (pending[uid] ||= { items: new Set(), general: false });
    if (id) p.items.add(id); else p.general = true;
    setSync("saving");
    clearTimeout(timers[uid]); timers[uid] = setTimeout(() => saveMarks(uid), 700);
  }
  async function saveMarks(uid) {
    const p = pending[uid]; if (!p) return;
    delete pending[uid];
    const m = mk(uid), now = new Date().toISOString();
    const data = { at: now, updatedAt: now };
    if (p.general) data.general = (m.general || "").trim();
    if (p.items.size) data.items = Object.fromEntries([...p.items].map(id => {
      const v = m.items[id];
      return [id, v && (v.verdict || (v.comment || "").trim()) ? { verdict: v.verdict || null, comment: (v.comment || "").trim() } : FB.deleteField()];
    }));
    try {
      await FB.setDoc(FB.doc(db, "marks", uid), data, { merge: true });
      m.at = now;
      if (!Object.keys(pending).length) setSync("ok");
    } catch (e) {
      const back = (pending[uid] ||= { items: new Set(), general: false });   // вернуть в очередь и попробовать ещё
      p.items.forEach(id => back.items.add(id)); back.general ||= p.general;
      setSync("error"); timers[uid] = setTimeout(() => saveMarks(uid), 15000);
    }
  }
  const lookAt = uid => FB.setDoc(FB.doc(db, "marks", uid), { lookAt: new Date().toISOString() }, { merge: true }).catch(() => {});

  /* ---------- отрисовка ---------- */
  function minis(st, ch) {
    return h("span", { class: "minis" }, (ch.tasks || []).map(t => {
      const s = st.nb.tasks?.[t.id], v = st.mk.items[t.id]?.verdict;
      return h("i", { class: ["mini", t.main && "is-main", s?.done && "is-done", v && "is-accepted"].filter(Boolean).join(" ") });
    }));
  }
  function open(uid) { view.selected = uid; saveView(); if (uid) { mk(uid).lookAt = new Date().toISOString(); lookAt(uid); } render(); scrollTo(0, 0); }
  function renderShelf() {
    $("#shelf").replaceChildren(...list().map(st => h("button", {
      class: "nb" + (view.selected === st.uid ? " is-active" : "") + (st.nb.updatedAt ? "" : " is-idle"), type: "button", onclick: () => open(st.uid)
    },
      hasNew(st) ? h("span", { class: "nb__new", text: "новое" }) : null,
      h("span", { class: "nb__name", text: nameOf(st) }),
      h("span", { class: "nb__meta" }, st.nb.student?.name && st.nb.login ? [h("span", { class: "nb__login", text: st.nb.login }), " · "] : null, metaOf(st)))));
  }
  function overview() {
    const rows = list();
    const head = [h("div", { class: "eyebrow", text: `Все ученики · ${rows.length}` }), h("h2", { class: "title", text: "Кто где на маршруте" })];
    if (!rows.length) return [...head, h("div", { class: "empty" },
      h("p", { class: "hand", text: "Пока ни одного ученика." }),
      h("p", { text: "Аккаунты заводит скрипт: node cloud/admin.mjs create (из папки 01_Блокнот) — он читает students.txt. Как только аккаунт появится, ученик будет здесь." }))];
    const table = h("table", { class: "over" },
      h("thead", {}, h("tr", {}, h("th", { text: "Ученик" }), C.chapters.map(ch => h("th", { class: "n", text: String(ch.n), title: ch.title })), h("th", { text: "Итого" }), h("th", { text: "Писал" }))),
      h("tbody", {}, rows.map(st => h("tr", {},
        h("td", { class: "who" }, h("button", { type: "button", text: nameOf(st), onclick: () => open(st.uid) }), st.nb.student?.name ? h("small", { text: st.nb.login || "" }) : null),
        C.chapters.map(ch => h("td", { class: "cell" }, minis(st, ch))),
        h("td", { class: "total", text: `${doneN(st)} / ${ALL.length}` }),
        h("td", { class: "when", text: st.nb.updatedAt ? fmtT(st.nb.updatedAt) : "—" })))));
    return [...head, table, h("p", { class: "facts", style: "margin-top:14px", text: "Жирный квадратик — главная задача главы. Закрашен — ученик вычеркнул. Красный — ты посмотрел. Всё обновляется само." })];
  }
  function reviewRow(st, t) {
    const s = st.nb.tasks?.[t.id] || {};
    const d = (st.mk.items[t.id] ||= { verdict: null, comment: "" });
    const vBtn = (val, label, cls) => {
      const b = h("button", { class: `btn btn--small ${cls}`, type: "button", "aria-pressed": String((d.verdict || null) === val), text: label });
      b.addEventListener("click", () => { d.verdict = val; touch(st.uid, t.id); b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); renderShelf(); updateMarked(st); });
      return b;
    };
    const ta = h("textarea", { class: "redpen", rows: "1", placeholder: "пометка на полях — ученик увидит сразу", "aria-label": `Пометка к задаче ${t.id}` });
    ta.value = d.comment || "";
    ta.addEventListener("input", () => { d.comment = ta.value; autosize(ta); touch(st.uid, t.id); updateMarked(st); });
    requestAnimationFrame(() => autosize(ta));
    const link = typeof s.link === "string" && /^https?:\/\//i.test(s.link) ? h("a", { class: "rv__link", href: s.link, target: "_blank", rel: "noopener noreferrer", text: s.link }) : (s.link ? h("div", { class: "rv__link", text: s.link }) : null);
    return h("div", { class: "rv" },
      h("div", { class: "rv__id", text: t.id }),
      h("div", {},
        t.quote ? h("p", { class: "rv__q", text: `«${t.quote}»` }) : null,
        h("p", { class: "rv__t" }, t.title || "Глава под словом — слово в базе не подошло", t.main ? h("span", { class: "star", text: "★ главная" }) : null),
        h("div", { class: "rv__state" + (s.done ? " is-done" : ""), text: s.done ? `вычеркнута ${fmtT(s.doneAt)}` : "не вычеркнута" }),
        h("div", { class: "rv__ans" + ((s.answer || "").trim() ? "" : " is-empty"), text: (s.answer || "").trim() || "ответа нет" }),
        link,
        h("div", { class: "rv__verdict", role: "group", "aria-label": `Отметка к задаче ${t.id}` },
          vBtn("seen", "Посмотрел", "v-acc"), vBtn(null, "Без отметки", "v-none")),   // оценок нет — только «посмотрел» и пометка
        ta));
  }
  const markedText = st => `отмечено задач: ${Object.values(st.mk.items).filter(v => v.verdict || (v.comment || "").trim()).length}`;
  function updateMarked(st) { const el = document.getElementById("marked"); if (el) el.textContent = markedText(st); }
  function studentView(st) {
    const back = h("button", { class: "btn btn--small", type: "button", text: "← Все ученики", onclick: () => open(null) });
    const gen = h("textarea", { class: "redpen", rows: "1", id: "gen", placeholder: "записка ученику — появится у него на первой странице", "aria-label": "Общая записка ученику" });
    gen.value = st.mk.general || "";
    gen.addEventListener("input", () => { st.mk.general = gen.value; autosize(gen); touch(st.uid, null); });
    requestAnimationFrame(() => autosize(gen));
    const only = h("input", { type: "checkbox", id: "only" }); only.checked = view.onlyAnswered;
    only.addEventListener("change", () => { view.onlyAnswered = only.checked; saveView(); render(); });
    const chapters = C.chapters.map(ch => {
      const tasks = (ch.tasks || []).map(t => byId[t.id]).filter(t => {
        if (!view.onlyAnswered) return true;
        const s = st.nb.tasks?.[t.id], m = st.mk.items[t.id];
        return s && (s.done || (s.answer || "").trim() || s.link) || m?.verdict || (m?.comment || "").trim();
      });
      if (!tasks.length) return null;
      return h("section", { class: "ch" }, h("h3", {}, `${ch.n}. ${ch.title}`, h("small", { text: ch.kind === "workshop" ? "воркшоп" : ch.kind === "meet" ? "знакомство" : "урок" })), tasks.map(t => reviewRow(st, t)));
    }).filter(Boolean);
    return [
      h("div", { class: "head" },
        h("div", {},
          h("div", { class: "eyebrow", text: `Блокнот ученика${st.nb.login ? " · " + st.nb.login : ""}` }),
          h("h2", { class: "who-name", text: nameOf(st) }),
          h("div", { class: "facts", text: st.nb.updatedAt ? `вычеркнуто ${doneN(st)} из ${ALL.length} · последняя запись ${fmtT(st.nb.updatedAt)}` : "блокнот ещё не открывали" })),
        h("div", { style: "display:flex;gap:8px;flex-wrap:wrap" }, back)),
      h("div", { class: "general" }, h("label", { class: "k", for: "gen", text: "Общая записка" }), gen),
      h("label", { class: "filters" }, only, "Показывать только задачи, где ученик что-то сделал"),
      ...(chapters.length ? chapters : [h("p", { class: "hand", style: "margin-top:20px", text: "Ученик пока ничего не сделал — задач с ответами нет." })]),
      h("div", { class: "footer" },
        h("span", { class: "hand", text: "Пометки сохраняются сами — ученик видит их сразу" }),
        h("span", { class: "spacer" }),
        h("span", { class: "facts", id: "marked", text: markedText(st) }))
    ];
  }
  function render() {
    $("#courseName").textContent = `«${C.title}»`;
    renderShelf();
    if (!ready) return;
    const st = view.selected && NB[view.selected] ? { uid: view.selected, nb: NB[view.selected], mk: mk(view.selected) } : null;
    $("#sheet").replaceChildren(...(st ? studentView(st) : overview()));
  }
  function renderSafe() {             // пришло новое: полку — сразу, лист — когда не пишу пометку
    renderShelf();
    if (document.activeElement?.closest("#sheet textarea, #sheet input")) {
      document.activeElement.addEventListener("blur", () => setTimeout(renderSafe, 0), { once: true }); return;
    }
    const y = scrollY; render(); scrollTo(0, y);
  }

  /* ---------- вход и подписка ---------- */
  function gate(text) {
    $("#sheet").replaceChildren(h("div", { class: "gate" }, h("p", { class: "hand", text }),
      h("p", {}, h("a", { href: CLOUD.home || "../", text: "← К блокноту" }))));
  }
  function listen() {
    FB.onSnapshot(FB.collection(db, "notebooks"), snap => {
      snap.docChanges().forEach(c => { if (c.type === "removed") delete NB[c.doc.id]; else NB[c.doc.id] = c.doc.data(); });
      ready = true; renderSafe();
    }, () => { setSync("error"); gate("Не получилось открыть блокноты учеников. Проверь интернет и обнови страницу."); });
    FB.onSnapshot(FB.collection(db, "marks"), snap => {
      if (snap.metadata.hasPendingWrites) return;          // мои же пометки, ещё в пути
      snap.docChanges().forEach(c => {
        const uid = c.doc.id;
        if (pending[uid]) return;                          // пока не отправил свои правки — не перетирать их
        const d = c.doc.data();
        MK[uid] = { general: d.general || "", items: Object.fromEntries(Object.entries(d.items || {}).map(([id, v]) => [id, { verdict: v.verdict || null, comment: v.comment || "" }])), at: d.at || null, lookAt: d.lookAt || null };
      });
      renderSafe();
    }, () => setSync("error"));
  }
  async function boot() {
    const emu = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    const app = FB.initializeApp(emu ? { apiKey: "demo-key", projectId: CLOUD.emuProject || "demo-vsmysle", authDomain: location.hostname } : CLOUD.config);
    auth = FB.getAuth(app);
    db = FB.initializeFirestore(app, { ignoreUndefinedProperties: true });
    if (emu) { FB.connectAuthEmulator(auth, `http://${location.hostname}:9099`, { disableWarnings: true }); FB.connectFirestoreEmulator(db, location.hostname, 8080); }
    $("#outBtn").addEventListener("click", async () => {
      if (Object.keys(pending).length) return toast("Секунду — ещё сохраняю пометки.", true);
      await FB.signOut(auth); location.replace(CLOUD.home || "../");
    });
    addEventListener("beforeunload", e => { if (Object.keys(pending).length) { e.preventDefault(); e.returnValue = ""; } });
    addEventListener("offline", () => setSync("offline"));
    addEventListener("online", () => setSync(Object.keys(pending).length ? "saving" : "ok"));
    FB.onAuthStateChanged(auth, async u => {
      if (!u) { location.replace(CLOUD.home || "../"); return; }
      let admin = false;
      try { admin = !!(await u.getIdTokenResult()).claims.admin; } catch (e) {}
      $("#outBtn").hidden = false;
      if (!admin) return gate("Стол открывается только по входу проверяющего, а этот вход — ученический.");
      try {
        const w = (await FB.getDoc(FB.doc(db, "private", "words"))).data() || {};
        await Promise.all(C.chapters.filter(ch => ch.lock && w[ch.n]).map(ch => unlock(ch, w[ch.n]).catch(() => {})));
        index();
      } catch (e) { toast("Слова к главам не подгрузились — у закрытых глав видны только номера задач.", true); }
      setSync("ok");
      listen();
    });
  }
  render();
  if (!CLOUD || !FB) gate("Этот Стол работает только на сайте.");
  else boot();
})();
</script>
</body>
</html>
